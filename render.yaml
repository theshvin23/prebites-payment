services:
  - type: web
    name: prebites-billplz-backend
    runtime: node
    rootDir: billplz-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BILLPLZ_SECRET_KEY
        sync: false
      - key: BILLPLZ_COLLECTION_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APP_URL
        value: https://pre-order-fyp.web.app
