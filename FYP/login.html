<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PreBites</title>
    <!-- Menyambungkan fail CSS luar -->
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="validation.css">
</head>
<body>

    <!-- BUTANG SATU KLIK KE LOGIN PENIAGA (Gaya Pill Pill Light Glassmorphism) -->
    <a href="login_seller.html" class="btn-seller-portal" style="position: absolute; top: 24px; right: 24px; z-index: 100;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span>Portal Peniaga</span>
        <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
        </svg>
    </a>

    <!-- Hiasan makanan terapung -->
    <div class="food-decor food-1">🍞</div>
    <div class="food-decor food-2">🥐</div>
    <div class="food-decor food-3">☕</div>
    <div class="food-decor food-4">🥞</div>

    <div class="login-container">
        <div class="logo-section">
            <h2>PreBites</h2>
            <p>Sistem Order Makanan Premis YES PSP</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="input-group">
                <label for="username">No. Matrik / ID Student</label>
                <div class="input-wrapper">
                    <input type="email" id="username" name="username" placeholder="Contoh: student@email.com" required>
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Kata Laluan</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Masukkan kata laluan" required>
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
            </div>

            <div class="forgot-pass">
                <a href="forgot_password.html">Lupa Kata Laluan?</a>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <div class="divider">atau log masuk dengan</div>

        <div class="social-login-container">
            <button type="button" class="btn-social btn-google" id="googleLoginButton">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-1.14 2.77-2.4 3.63v3h3.86c2.26-2.09 3.59-5.17 3.59-8.48z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.21v3.11C3.18 21.88 7.31 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.29a7.18 7.18 0 0 1 0-4.58V6.6H1.21a11.94 11.94 0 0 0 0 10.8l4.06-3.11z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 6.6l4.06 3.11c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                Google
            </button>
        </div>

        <div class="footer-text">
            Belum ada akaun? <a href="register.html">Daftar Sini</a>
        </div>
    </div>

<script src="validation.js"></script>
<script type="module">
    import { initializeLoginPage } from './auth.js';
    import { initializeGoogleLogin } from './auth.js';

    initializeLoginPage({
        role: 'customer',
        formId: 'loginForm',
        emailId: 'username',
        passwordId: 'password',
        redirect: 'homepage.html'
    });
    initializeGoogleLogin({
        role: 'customer',
        buttonId: 'googleLoginButton',
        redirect: 'homepage.html'
    });
</script>
</body>
</html>
