<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pelajar | PreBites</title>
    <link rel="stylesheet" href="validation.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow-x: hidden;
        }

        .food-decor {
            position: fixed;
            font-size: 60px;
            opacity: 0.05;
            pointer-events: none;
            animation: float 20s infinite;
        }

        .food-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .food-2 { top: 60%; right: 8%; animation-delay: 2s; }
        .food-3 { top: 30%; right: 5%; animation-delay: 4s; }
        .food-4 { bottom: 10%; left: 10%; animation-delay: 6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .register-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #007AFF;
            transform: translateX(-4px);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section span.student-badge {
            background: rgba(0, 122, 255, 0.2);
            color: #007AFF;
            border: 1px solid rgba(0, 122, 255, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .logo-section h2 {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0;
            letter-spacing: -0.5px;
        }

        .logo-section h2 span {
            color: #007AFF;
        }

        .logo-section p {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-wrapper input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 122, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .input-wrapper svg {
            position: absolute;
            left: 12px;
            width: 18px;
            height: 18px;
            color: #aaa;
            pointer-events: none;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #007AFF 0%, #0051D5 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 122, 255, 0.3);
        }

        .google-register {
            width: 100%;
            padding: 13px 14px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #202124;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .google-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .google-register:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .google-register svg {
            flex: 0 0 auto;
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #ff453a;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
        }

        .footer-text a {
            color: #007AFF;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .footer-text a:hover {
            color: #0051D5;
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #007AFF;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .register-container {
                padding: 40px 24px;
                margin: 20px;
            }

            .logo-section h2 {
                font-size: 28px;
            }
        }

        @media (max-width: 360px) {
            body { padding: 12px; }
            .register-container { padding: 32px 14px; margin: 8px; }
            .logo-section h2 { font-size: 26px; }
            .logo-section p { font-size: 12px; }
            .back-link { left: 14px; top: 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Food decorations -->
    <div class="food-decor food-1">🍔</div>
    <div class="food-decor food-2">🍕</div>
    <div class="food-decor food-3">🍟</div>
    <div class="food-decor food-4">🥤</div>

    <a href="login.html" class="back-link">
        <span>← Kembali ke Log Masuk</span>
    </a>

    <div class="register-container">
        <div class="logo-section">
            <span class="student-badge">Pendaftaran Pelajar</span>
            <h2>PreBites</h2>
            <p>Cipta Akaun Pelajar Baru untuk Sistem Order Makanan</p>
        </div>

        <form id="registerForm" novalidate>
            <div class="input-group">
                <label for="nama">Nama Pelajar</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="text" id="nama" name="nama" placeholder="Cth: Atif Bin Samad" required>
                </div>
                <div class="error-msg" id="namaError"></div>
            </div>

            <div class="input-group">
                <label for="email">Email Pelajar</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="email" id="email" name="email" placeholder="Cth: student@email.com" required>
                </div>
                <div class="error-msg" id="emailError"></div>
            </div>

            <div class="input-group">
                <label for="matrikId">No. Matrik</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                    <input type="text" id="matrikId" name="matrikId" placeholder="Cth: 01DDT24F10XX" required>
                </div>
                <div class="error-msg" id="matrikError"></div>
            </div>

            <div class="input-group">
                <label for="password">Kata Laluan</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="password" name="password" placeholder="Minimum 6 aksara" required>
                </div>
                <div class="error-msg" id="passwordError"></div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Sahkan Kata Laluan</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Masukkan semula kata laluan" required>
                </div>
                <div class="error-msg" id="confirmError"></div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 12px; font-size: 12px;">Mendaftarkan akaun...</p>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">Daftar Pelajar</button>
            <div class="error-msg" id="formError"></div>
        </form>

        <button type="button" class="google-register" id="googleRegisterButton">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.69c-.29 1.5-1.14 2.77-2.4 3.63v3h3.86c2.26-2.09 3.59-5.17 3.59-8.48z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.21v3.11C3.18 21.88 7.31 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.29a7.18 7.18 0 0 1 0-4.58V6.6H1.21a11.94 11.94 0 0 0 0 10.8l4.06-3.11z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 6.6l4.06 3.11c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Daftar dengan Google
        </button>

        <div class="footer-text">
            Sudah ada akaun? <a href="login.html">Log Masuk Sini</a>
        </div>
    </div>

    <script src="validation.js"></script>
    <!-- Local Storage Registration (No Firebase Required) -->
    <script type="text/plain" id="legacy-customer-registration">
      // This version uses localStorage - NO Firebase needed for students!
      // Students can register completely offline
      
      const form = document.getElementById('registerForm');
      const loading = document.getElementById('loading');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Clear previous error messages
        document.getElementById('formError').innerHTML = '';
        document.getElementById('namaError').innerHTML = '';
        document.getElementById('emailError').innerHTML = '';
        document.getElementById('matrikError').innerHTML = '';
        document.getElementById('passwordError').innerHTML = '';
        document.getElementById('confirmError').innerHTML = '';

        // Get form values
        const nama = document.getElementById('nama').value.trim();
        const email = document.getElementById('email').value.trim();
        const matrikId = document.getElementById('matrikId').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        let hasError = false;

        // Validation
        if (nama.length < 3) {
          document.getElementById('namaError').textContent = 'Nama mesti sekurang-kurangnya 3 aksara';
          document.getElementById('namaError').classList.add('show');
          hasError = true;
        }

        if (!email.includes('@')) {
          document.getElementById('emailError').textContent = 'Email tidak sah';
          document.getElementById('emailError').classList.add('show');
          hasError = true;
        }

        if (matrikId.length < 8) {
          document.getElementById('matrikError').textContent = 'No. Matrik tidak sah (minimum 8 aksara)';
          document.getElementById('matrikError').classList.add('show');
          hasError = true;
        }

        if (password.length < 6) {
          document.getElementById('passwordError').textContent = 'Kata laluan mesti sekurang-kurangnya 6 aksara';
          document.getElementById('passwordError').classList.add('show');
          hasError = true;
        }

        if (password !== confirmPassword) {
          document.getElementById('confirmError').textContent = 'Kata laluan tidak sepadan';
          document.getElementById('confirmError').classList.add('show');
          hasError = true;
        }

        if (hasError) return;

        // Check if user already exists
        let users = JSON.parse(localStorage.getItem('prebites_users') || '[]');
        
        const userExists = users.find(u => u.email === email || u.matrik === matrikId);
        if (userExists) {
          if (userExists.email === email) {
            document.getElementById('emailError').textContent = 'Email ini sudah didaftarkan!';
          } else {
            document.getElementById('matrikError').textContent = 'No. Matrik ini sudah didaftarkan!';
          }
          return;
        }

        // Show loading
        loading.style.display = 'block';
        submitBtn.disabled = true;

        // Simulate registration delay
        setTimeout(() => {
          try {
            // Create new user object
            const newUser = {
              id: 'STU_' + Date.now(),
              nama: nama,
              email: email,
              matrik: matrikId,
              password: password,
              createdAt: new Date().toISOString(),
              status: 'active'
            };

            // Save to localStorage
            users.push(newUser);
            localStorage.setItem('prebites_users', JSON.stringify(users));

            // Create empty order and cart data for this user
            localStorage.setItem('user_cart_' + newUser.id, JSON.stringify([]));
            localStorage.setItem('user_orders_' + newUser.id, JSON.stringify([]));

            // Success message
            loading.style.display = 'none';
            form.style.display = 'none';
            submitBtn.disabled = false;
            
            document.querySelector('.logo-section').innerHTML = `
              <span class="student-badge">✅ Berjaya!</span>
              <h2>PreBites</h2>
              <p style="color: #007AFF; margin-top: 12px;">Akaun pelajar berjaya dibuat! Terima kasih ${nama}.</p>
              <p style="color: #aaa; margin-top: 8px; font-size: 12px;">Anda akan dipindahkan ke halaman log masuk...</p>
            `;

            // Redirect to login
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2500);

          } catch (error) {
            console.error("Registration error:", error);
            document.getElementById('formError').textContent = '❌ Ralat: ' + error.message;
            loading.style.display = 'none';
            submitBtn.disabled = false;
          }
        }, 1500); // Simulate network delay
      });
    </script>
