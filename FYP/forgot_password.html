<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Laluan | PreBites</title>
    <!-- Guna fail CSS yang kita selaraskan di bawah -->
    <link rel="stylesheet" href="forgot_password.css">
    <link rel="stylesheet" href="validation.css">
</head>
<body>

    <!-- Elemen hiasan makanan comel terapung (Sebiji macam Register) -->
    <div class="food-decor food-1">🍿</div>
    <div class="food-decor food-2">🍰</div>
    <div class="food-decor food-3">🍱</div>
    <div class="food-decor food-4">🧋</div>

    <div class="login-container">
        <div class="logo-section">
            <h2>PreBites</h2>
            <p>Masukkan emel anda untuk menetapkan semula kata laluan</p>
        </div>

        <!-- Mesej Maklum Balas Sukses/Ralat (Sembunyi secara default) -->
        <div id="statusMessage" class="status-message success hidden"></div>

        <form id="forgotPasswordForm" onsubmit="handleReset(event)" novalidate>
            
            <!-- Input Emel dengan susunan SVG yang betul di bawah input -->
            <div class="input-group">
                <label for="email">Alamat Emel</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="Contoh: nama@student.psp.edu.my" required>
                    <!-- Ikon Emel SVG Moden -->
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                </div>
            </div>

            <!-- Menggunakan butang premium Charcoal (.btn-login) -->
            <button type="submit" class="btn-login">Hantar Pautan</button>
        </form>

        <div class="footer-text">
            Sudah ingat kata laluan? <a href="login.html">Log Masuk</a>
        </div>
    </div>

    <script type="text/plain" id="legacy-customer-reset">
        // Simulasi fungsi hantar emel
        function handleReset(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email').value;
            const statusBox = document.getElementById('statusMessage');

            if(emailInput) {
                statusBox.classList.remove('hidden');
                statusBox.innerText = `Pautan tetapan semula telah dihantar ke emel anda!`;
                document.getElementById('email').value = '';
            }
        }
    </script>
    <script src="validation.js"></script>
    <script type="module">
        import { initializePasswordReset } from './password-reset.js';

        initializePasswordReset('forgotPasswordForm', 'email', 'statusMessage');
    </script>
</body>
</html>
