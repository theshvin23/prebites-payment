<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Peniaga | PreBites Seller</title>
    <link rel="stylesheet" href="validation.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background:
                radial-gradient(circle at top right, rgba(48, 209, 88, 0.15) 0%, transparent 45%),
                radial-gradient(circle at bottom left, rgba(10, 132, 255, 0.08) 0%, transparent 45%),
                #050508;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow-x: hidden;
            padding: 32px 24px;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.12;
            pointer-events: none;
            background-image:
                linear-gradient(90deg, rgba(48, 209, 88, 0.15) 1px, transparent 1px),
                linear-gradient(rgba(48, 209, 88, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at center, white, transparent 75%);
        }

        .food-decor {
            position: fixed;
            font-size: 60px;
            opacity: 0.05;
            pointer-events: none;
            animation: float 20s infinite;
        }

        .food-1 { top: 10%; left: 5%; animation-delay: 0s; }
        .food-2 { top: 60%; right: 8%; animation-delay: 2s; }
        .food-3 { top: 30%; right: 5%; animation-delay: 4s; }
        .food-4 { bottom: 10%; left: 10%; animation-delay: 6s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .register-container {
            background: rgba(20, 20, 28, 0.78);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 48px 40px 38px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .register-container:hover {
            transform: translateY(-4px);
            border-color: rgba(48, 209, 88, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 30px 70px rgba(48, 209, 88, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #30d158;
            transform: translateX(-4px);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section span.seller-badge {
            background: rgba(48, 209, 88, 0.2);
            color: #30d158;
            border: 1px solid rgba(48, 209, 88, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .logo-section h2 {
            color: #fff;
            font-size: 36px;
            font-weight: 800;
            margin: 10px 0;
            letter-spacing: -0.05em;
        }

        .logo-section h2 span {
            color: #30d158;
        }

        .logo-section p {
            font-size: 14px;
            color: #aeaeb2;
            font-weight: 500;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #aeaeb2;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            min-height: 52px;
            padding: 15px 16px 15px 50px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            font-size: 14px;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-wrapper select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            color-scheme: dark;
            background-image: linear-gradient(45deg, transparent 50%, #30d158 50%), linear-gradient(135deg, #30d158 50%, transparent 50%);
            background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px;
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
        }

        .input-wrapper select option {
            background: #18181f;
            color: #fff;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            outline: none;
            background-color: rgba(48, 209, 88, 0.02);
            border-color: #30d158;
            box-shadow: 0 0 0 4px rgba(48, 209, 88, 0.15), inset 0 1px 1px rgba(48, 209, 88, 0.2);
            transform: translateY(-1px);
        }

        .input-wrapper svg {
            position: absolute;
            left: 18px;
            width: 18px;
            height: 18px;
            fill: #636366;
            pointer-events: none;
            z-index: 1;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: #30d158;
            border: none;
            border-radius: 14px;
            color: #050508;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(48, 209, 88, 0.3);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            background: #34c759;
            box-shadow: 0 12px 35px rgba(48, 209, 88, 0.5);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .qr-upload-note {
            margin-top: 8px;
            color: #aaa;
            font-size: 11px;
            line-height: 1.4;
        }

        .error-msg {
            color: #ff453a;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .success-msg {
            color: #30d158;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .success-msg.show {
            display: block;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
        }

        .footer-text a {
            color: #30d158;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .footer-text a:hover {
            color: #34c759;
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            font-size: 12px;
            color: #aaa;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #30d158;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .register-container {
                padding: 40px 24px;
                margin: 20px;
            }

            .logo-section h2 {
                font-size: 28px;
            }
        }

        @media (max-width: 360px) {
            body { padding: 12px; }
            .register-container { padding: 32px 14px; margin: 8px; }
            .logo-section h2 { font-size: 26px; }
            .logo-section p { font-size: 12px; }
            .back-link { left: 14px; top: 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Food decorations -->
    <div class="food-decor food-1">🏪</div>
    <div class="food-decor food-2">🍱</div>
    <div class="food-decor food-3">☕</div>
    <div class="food-decor food-4">🧋</div>

    <a href="login_seller.html" class="back-link">
        <span>← Kembali ke Log Masuk</span>
    </a>

    <div class="register-container">
        <div class="logo-section">
            <span class="seller-badge">Pendaftaran Peniaga</span>
            <h2>PreBites<span>.</span></h2>
            <p>Cipta Akaun Peniaga Baru untuk Sistem Pengurusan Pesanan</p>
        </div>

        <form id="registerForm" novalidate>
            <div class="input-group">
                <label for="nama">Nama Peniaga</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <input type="text" id="nama" name="nama" placeholder="Cth: YTS Cafe" required>
                </div>
                <div class="error-msg" id="namaError"></div>
            </div>

            <div class="input-group">
                <label for="email">Email Peniaga</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="email" id="email" name="email" placeholder="Cth: seller@email.com" required>
                </div>
                <div class="error-msg" id="emailError"></div>
            </div>

            <div class="input-group">
                <label for="password">Kata Laluan</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="password" name="password" placeholder="Minimum 6 aksara" required>
                </div>
                <div class="error-msg" id="passwordError"></div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Sahkan Kata Laluan</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Masukkan semula kata laluan" required>
                </div>
                <div class="error-msg" id="confirmError"></div>
            </div>

            <div class="input-group">
                <label for="storeId">Nombor Kedai (1-11)</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    <select id="storeId" name="storeId" required>
                        <option value="">-- Pilih Nombor Kedai --</option>
                        <option value="1">Kedai 1</option>
                        <option value="2">Kedai 2</option>
                        <option value="3">Kedai 3</option>
                        <option value="4">Kedai 4</option>
                        <option value="5">Kedai 5</option>
                        <option value="6">Kedai 6</option>
                        <option value="7">Kedai 7</option>
                        <option value="8">Kedai 8</option>
                        <option value="9">PROTOTYPE 1</option>
                        <option value="10">PROTOTYPE 2</option>
                        <option value="11">PROTOTYPE 3</option>
                    </select>
                </div>
                <div class="error-msg" id="storeError"></div>
            </div>

            <div class="input-group">
                <label for="bankQr">QR Bank / DuitNow *</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm6 0h2v2h-2V5zm4-2h6v8h-8v-2h2V5h-2V3zm2 2v4h2V5h-2zM3 13h2v2H3v-2zm4 0h4v2H7v-2zm6 0h2v2h-2v-2zm4 0h4v2h-4v-2zM3 17h8v4H3v-4zm2 2v0h4v-0H5zm8-2h2v4h-2v-4zm4 0h6v4h-6v-4zm2 2h2v0h-2v0z"/></svg>
                    <input type="file" id="bankQr" name="bankQr" accept="image/png,image/jpeg,image/webp" required style="padding-left: 40px; color: #fff;">
                </div>
                <div class="qr-upload-note">Muat naik gambar QR bank yang pelanggan boleh imbas untuk bayaran. Maksimum 700 KB.</div>
                <div class="error-msg" id="qrError"></div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 12px; font-size: 12px;">Mendaftarkan akaun...</p>
            </div>

            <button type="submit" class="btn-register" id="submitBtn">Daftar Peniaga</button>
            <div class="error-msg" id="formError"></div>
            <div class="success-msg" id="formSuccess"></div>
        </form>

        <div class="footer-text">
            Sudah ada akaun? <a href="login_seller.html">Log Masuk Sini</a>
        </div>
    </div>

    <script src="validation.js"></script>
    <!-- Firebase SDK Setup -->
    <script type="module">
      // Import Firebase modules
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Your Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCnVVcO2VtV2NB3GFR0wNpsKMSNcceKpEc",
        authDomain: "pre-order-fyp.firebaseapp.com",
        projectId: "pre-order-fyp",
        storageBucket: "pre-order-fyp.firebasestorage.app",
        messagingSenderId: "434593930804",
        appId: "1:434593930804:web:45a63ad202876204957461",
        measurementId: "G-VKS1EH03TJ"
      };

      // Initialize Firebase Services
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      console.log("Firebase initialized for Seller Registration!");

      const form = document.getElementById('registerForm');
      const loading = document.getElementById('loading');
      const submitBtn = document.getElementById('submitBtn');

            function readQrFile(file) {
                return new Promise((resolve, reject) => {
                    if (!file) {
                        reject(new Error('Sila muat naik gambar QR bank.'));
                        return;
                    }
                    if (file.size > 700 * 1024) {
                        reject(new Error('Gambar QR terlalu besar. Sila gunakan fail maksimum 700 KB.'));
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('Gagal membaca gambar QR.'));
                    reader.readAsDataURL(file);
                });
            }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous messages
        document.getElementById('formError').innerHTML = '';
        document.getElementById('formSuccess').innerHTML = '';
        document.getElementById('namaError').innerHTML = '';
        document.getElementById('emailError').innerHTML = '';
        document.getElementById('passwordError').innerHTML = '';
        document.getElementById('confirmError').innerHTML = '';
        document.getElementById('storeError').innerHTML = '';
        document.getElementById('qrError').innerHTML = '';

        // Get form values
        const nama = document.getElementById('nama').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const storeId = document.getElementById('storeId').value;
        const qrFile = document.getElementById('bankQr').files[0];

        let hasError = false;

        // Validation
        if (nama.length < 3) {
          document.getElementById('namaError').textContent = 'Nama mesti sekurang-kurangnya 3 aksara';
          document.getElementById('namaError').classList.add('show');
          hasError = true;
        }

        if (password.length < 6) {
          document.getElementById('passwordError').textContent = 'Kata laluan mesti sekurang-kurangnya 6 aksara';
          document.getElementById('passwordError').classList.add('show');
          hasError = true;
        }

        if (password !== confirmPassword) {
          document.getElementById('confirmError').textContent = 'Kata laluan tidak sepadan';
          document.getElementById('confirmError').classList.add('show');
          hasError = true;
        }

        if (!storeId) {
          document.getElementById('storeError').textContent = 'Sila pilih nombor kedai';
          document.getElementById('storeError').classList.add('show');
          hasError = true;
        }

                if (!qrFile) {
                    document.getElementById('qrError').textContent = 'Sila muat naik gambar QR bank.';
                    document.getElementById('qrError').classList.add('show');
                    hasError = true;
                } else if (qrFile.size > 700 * 1024) {
                    document.getElementById('qrError').textContent = 'Gambar QR terlalu besar. Maksimum 700 KB.';
                    document.getElementById('qrError').classList.add('show');
                    hasError = true;
                }

        if (hasError) return;

        // Show loading
        loading.style.display = 'block';
        submitBtn.disabled = true;

        try {
          // Check if store ID already taken
          const sellersRef = collection(db, 'sellers');
          const q = query(sellersRef, where('storeId', '==', parseInt(storeId)));
          const existingDocs = await getDocs(q);

          if (!existingDocs.empty) {
            document.getElementById('storeError').textContent = 'Kedai ini sudah didaftarkan. Sila pilih kedai lain.';
            document.getElementById('storeError').classList.add('show');
            loading.style.display = 'none';
            submitBtn.disabled = false;
            return;
          }

          // Create Firebase Auth user
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          const qrImage = await readQrFile(qrFile);

          // Save seller data to Firestore
                    await setDoc(doc(db, 'sellers', user.uid), {
            uid: user.uid,
            nama: nama,
            email: email,
            storeId: parseInt(storeId),
            store_id: `stall_${storeId}`,
                        role: 'seller',
                        createdAt: serverTimestamp(),
            status: 'active'
          });

                    await setDoc(doc(db, 'shops', `stall_${storeId}`), {
                        store_id: `stall_${storeId}`,
                        name: `${nama} (Stall No. ${storeId})`,
                        ownerName: nama,
                        status: 'buka',
                        qrImage,
                        qrOffsetX: 0,
                        qrOffsetY: 0,
                        qrScale: 1,
                        createdAt: serverTimestamp()
                    }, { merge: true });

          // Success
          loading.style.display = 'none';
          form.style.display = 'none';
          document.querySelector('.logo-section').innerHTML = `
            <span class="seller-badge">Berjaya!</span>
            <h2>PreBites<span>.</span></h2>
            <p style="color: #30d158; margin-top: 12px;">Akaun peniaga berjaya dibuat!</p>
          `;

          setTimeout(() => {
            window.location.href = 'login_seller.html';
          }, 2000);

        } catch (error) {
          console.error("Registration error:", error.code, error.message);
          
          let errorMsg = error.message;
                    if (error.code === 'auth/email-already-in-use') {
                        errorMsg = 'Email ini sudah mempunyai akaun Firebase. Jika akaun ini sudah peniaga, sila log masuk. Jika akaun ini pelanggan, gunakan email lain untuk akaun peniaga.';
          } else if (error.code === 'auth/invalid-email') {
            errorMsg = 'Email tidak sah. Sila masukkan email yang betul.';
                    } else if (error.code === 'auth/weak-password') {
                        errorMsg = 'Kata laluan mesti sekurang-kurangnya 6 aksara.';
                    } else if (error.code === 'auth/operation-not-allowed') {
                        errorMsg = 'Pendaftaran email belum diaktifkan dalam Firebase Console > Authentication > Sign-in providers.';
                    } else if (error.code === 'permission-denied') {
                        errorMsg = 'Firebase menolak simpanan profil peniaga. Semak Firestore Rules untuk sellers dan shops.';
          }

          document.getElementById('formError').textContent = errorMsg;
          document.getElementById('formError').classList.add('show');
          
          loading.style.display = 'none';
          submitBtn.disabled = false;
        }
      });
    </script>
</body>
</html>
